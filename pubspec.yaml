name: dispatch_rider_new
description: A Flutter app to connect dispatch riders with clients for package delivery.
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI / Animations
  lottie: ^3.1.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fluttertoast: ^8.2.8

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  location: ^6.0.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.4.4

  # Notifications
  flutter_local_notifications: ^18.0.1

  # State Management & Storage
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Utilities
  url_launcher: ^6.3.1
  http: ^1.2.2
  image_picker: ^1.1.2

  # Loading UI
  loading_overlay: ^0.5.0
  firebase_storage: ^12.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/google_icon.png
    - assets/icloud_icon.png
    - assets/animations/Delivery Riding.json

